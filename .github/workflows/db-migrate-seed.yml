name: BD - Migrações + Seed (manual)

on:
  workflow_dispatch:
    inputs:
      run_seed:
        description: "Também correr o seed inicial (organização/admin) além das migrações?"
        type: boolean
        default: true
      reset_superadmin_password:
        description: "Substituir a password do superadmin pela do secret SEED_SUPERADMIN_PASSWORD? (exige o seed ativo)"
        type: boolean
        default: false

jobs:
  migrate-seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # O GitHub só mascara o secret inteiro; o "prisma migrate deploy" imprime
      # o host e o nome da base de dados de produção. Mascarar as partes.
      - name: Mascarar host e base de dados nos logs
        run: |
          node -e 'const u = new URL(process.env.DATABASE_URL); for (const v of [u.hostname, u.username, u.pathname.slice(1)]) if (v) console.log("::add-mask::" + v)'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Aplicar migrações (prisma migrate deploy)
        run: npx --no-install prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Seed inicial (organização, admin, brand kit)
        if: ${{ inputs.run_seed }}
        run: npm run db:seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # A password vem sempre de um secret e o seed nunca a escreve no
          # output em CI (ver prisma/seed-superadmin.ts). Sem o secret, o seed
          # recusa criar o superadmin em vez de gerar uma password para o log.
          SEED_SUPERADMIN_PASSWORD: ${{ secrets.SEED_SUPERADMIN_PASSWORD }}
          SEED_SUPERADMIN_RESET_PASSWORD: ${{ inputs.reset_superadmin_password }}
